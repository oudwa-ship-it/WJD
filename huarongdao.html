<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>華容道小遊戲</title>
<style>
    body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        background-color: #eef2f7;
        flex-direction: column;
    }
    h1 {
        margin-bottom: 20px;
    }
    #game-container {
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    #game-board {
        width: 400px;
        height: 500px;
        border: 2px solid rgba(0,0,0,0.25);
        border-radius: 16px;
        box-shadow: 0 14px 36px rgba(0,0,0,0.10);
        position: relative;
        background-color: #f8fafc;
    }
    .piece {
        position: absolute;
        box-sizing: border-box;
        cursor: pointer;
        transition: transform 0.12s ease, box-shadow 0.12s ease, outline-color 0.12s ease;
        border-radius: 14px;
        border: 2px solid rgba(0, 0, 0, 0.15);
        box-shadow: 0 8px 18px rgba(0,0,0,0.12);
        color: #ffffff;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 24px;
        font-weight: 800;
        user-select: none;
    }
    .piece:hover {
        transform: translateY(-1px);
        box-shadow: 0 10px 22px rgba(0,0,0,0.16);
    }
    .piece.selected {
        border: 3px solid #ffb300;
        box-shadow: 0 0 0 4px rgba(255, 179, 0, 0.25), 0 12px 26px rgba(0,0,0,0.18);
    }

    /* 顏色（更柔和、對比清楚） */
    #cao-cao { width: 200px; height: 200px; background: #e53935; }
    .vertical { width: 100px; height: 200px; background: #1e88e5; }
    .horizontal { width: 200px; height: 100px; background: #8e24aa; }
    .soldier { width: 100px; height: 100px; background: #f9a825; color: #111827; }
    #info-panel {
        margin-top: 20px;
        font-size: 24px;
    }
    #reset-button {
        margin-top: 20px;
        padding: 10px 20px;
        font-size: 18px;
        cursor: pointer;
    }
    #win-message {
        display: none;
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background-color: rgba(0, 0, 0, 0.7);
        color: white;
        padding: 20px;
        border-radius: 10px;
        font-size: 28px;
        text-align: center;
            z-index: 999;
    }
</style>
</head>
<body>

<h1>華容道</h1>

<div id="game-container">
    <div id="game-board">
        </div>
    <div id="info-panel">
        步數: <span id="move-count">0</span>
    </div>
    <button id="reset-button">重新開始</button>
    <div id="win-message">
        恭喜！<br>您成功了！
    </div>
</div>

<script>
    const gameBoard = document.getElementById('game-board');
    const moveCountSpan = document.getElementById('move-count');
    const resetButton = document.getElementById('reset-button');
    const winMessage = document.getElementById('win-message');
    const unitSize = 100; // 棋盤格子的基本大小 (px)
    let moveCount = 0;
    let selectedPiece = null;

    // 棋子佈局 (x, y, 寬, 高, id, 類型, 名稱)
    const initialLayout = [
        // 目標：中間兩欄從上到下是：曹操、關羽、兩個卒（起始局面可解）

        // 曹操(2×2) @ (1,0)
        { x: 1, y: 0, w: 2, h: 2, id: 'cao-cao', type: 'cao-cao', name: '曹操' },

        // 張飛(1×2) @ (0,0)
        { x: 0, y: 0, w: 1, h: 2, id: 'zhang-fei', type: 'vertical', name: '張飛' },

        // 馬超(1×2) @ (3,0)
        { x: 3, y: 0, w: 1, h: 2, id: 'ma-chao', type: 'vertical', name: '馬超' },

        // 關羽(2×1) @ (1,2)
        { x: 1, y: 2, w: 2, h: 1, id: 'guan-yu', type: 'horizontal', name: '關羽' },

        // 趙雲(1×2) @ (0,2)
        { x: 0, y: 2, w: 1, h: 2, id: 'zhao-yun', type: 'vertical', name: '趙雲' },

        // 黃忠(1×2) @ (3,2)
        { x: 3, y: 2, w: 1, h: 2, id: 'huang-zhong', type: 'vertical', name: '黃忠' },

        // 卒×4（其中兩個在中間，位於關羽下面）
        // (1,3),(2,3),(0,4),(3,4)
        { x: 1, y: 3, w: 1, h: 1, id: 'zu-1', type: 'soldier', name: '卒' },
        { x: 2, y: 3, w: 1, h: 1, id: 'zu-2', type: 'soldier', name: '卒' },
        { x: 0, y: 4, w: 1, h: 1, id: 'zu-3', type: 'soldier', name: '卒' },
        { x: 3, y: 4, w: 1, h: 1, id: 'zu-4', type: 'soldier', name: '卒' }
    ];

    let pieces = [];

    function createPieces() {
        gameBoard.innerHTML = '';
        pieces = JSON.parse(JSON.stringify(initialLayout)).map(layout => {
            const piece = document.createElement('div');
            piece.id = layout.id;
            piece.className = `piece ${layout.type}`;
            piece.textContent = layout.name;
            piece.style.left = `${layout.x * unitSize}px`;
            piece.style.top = `${layout.y * unitSize}px`;
            piece.style.width = `${layout.w * unitSize}px`;
            piece.style.height = `${layout.h * unitSize}px`;
            
            piece.dataset.x = layout.x;
            piece.dataset.y = layout.y;
            piece.dataset.w = layout.w;
            piece.dataset.h = layout.h;

            piece.addEventListener('click', () => selectPiece(piece));
            gameBoard.appendChild(piece);
            return piece;
        });
    }

    function selectPiece(piece) {
        if (selectedPiece) {
            selectedPiece.classList.remove('selected');
        }
        if (selectedPiece === piece) {
            selectedPiece = null;
        } else {
            selectedPiece = piece;
            selectedPiece.classList.add('selected');
        }
    }

    gameBoard.addEventListener('click', (e) => {
        if (e.target === gameBoard && selectedPiece) {
            const rect = gameBoard.getBoundingClientRect();
            const x = Math.floor((e.clientX - rect.left) / unitSize);
            const y = Math.floor((e.clientY - rect.top) / unitSize);

            // 只允許點到「空白格」才嘗試移動（避免跨越多格的 bug）
            if (isCellOccupied(x, y)) return;

            movePiece(selectedPiece, x, y);
        }
    });


    function isCellOccupied(x, y) {
        for (const piece of pieces) {
            const px = parseInt(piece.dataset.x);
            const py = parseInt(piece.dataset.y);
            const pw = parseInt(piece.dataset.w);
            const ph = parseInt(piece.dataset.h);

            if (x >= px && x < px + pw && y >= py && y < py + ph) {
                return true;
            }
        }
        return false;
    }

    function movePiece(piece, emptyX, emptyY) {
        const x = parseInt(piece.dataset.x);
        const y = parseInt(piece.dataset.y);
        const w = parseInt(piece.dataset.w);
        const h = parseInt(piece.dataset.h);

        let newX = x;
        let newY = y;

        // ✅ 允許「沿著連續空格」一次滑動多格：
        // - 必須是同一方向（左/右/上/下）
        // - 路徑上每一格都要是空白（不能跨越其他方塊）

        // 檢查水平/垂直移動的路徑是否連續空白
        function isPathClear(dir, dist) {
            if (dist <= 0) return false;

            if (dir === 'left') {
                // 逐格檢查會進入的「左側新欄位」
                for (let d = 1; d <= dist; d++) {
                    const cx = x - d;
                    for (let ry = y; ry < y + h; ry++) {
                        if (isCellOccupied(cx, ry)) return false;
                    }
                }
                return true;
            }

            if (dir === 'right') {
                for (let d = 1; d <= dist; d++) {
                    const cx = x + w - 1 + d;
                    for (let ry = y; ry < y + h; ry++) {
                        if (isCellOccupied(cx, ry)) return false;
                    }
                }
                return true;
            }

            if (dir === 'up') {
                for (let d = 1; d <= dist; d++) {
                    const cy = y - d;
                    for (let rx = x; rx < x + w; rx++) {
                        if (isCellOccupied(rx, cy)) return false;
                    }
                }
                return true;
            }

            if (dir === 'down') {
                for (let d = 1; d <= dist; d++) {
                    const cy = y + h - 1 + d;
                    for (let rx = x; rx < x + w; rx++) {
                        if (isCellOccupied(rx, cy)) return false;
                    }
                }
                return true;
            }

            return false;
        }

        // 左：點到棋子左邊同一「高度帶」的空白格
        if (emptyX < x && emptyY >= y && emptyY < y + h) {
            newX = emptyX;     // 點到哪一欄，就把「左邊界」移到那一欄
            const dist = x - newX;
            if (!isPathClear('left', dist)) return;
        }
        // 右：點到棋子右邊同一「高度帶」的空白格
        else if (emptyX > x + w - 1 && emptyY >= y && emptyY < y + h) {
            newX = emptyX - (w - 1);   // 讓你點到的格子變成「新的右邊界」
            const dist = newX - x;
            if (!isPathClear('right', dist)) return;
        }
        // 上：點到棋子上方同一「寬度帶」的空白格
        else if (emptyY < y && emptyX >= x && emptyX < x + w) {
            newY = emptyY;     // 點到哪一列，就把「上邊界」移到那一列
            const dist = y - newY;
            if (!isPathClear('up', dist)) return;
        }
        // 下：點到棋子下方同一「寬度帶」的空白格
        else if (emptyY > y + h - 1 && emptyX >= x && emptyX < x + w) {
            newY = emptyY - (h - 1);   // 讓你點到的格子變成「新的下邊界」
            const dist = newY - y;
            if (!isPathClear('down', dist)) return;
        } else {
            // 不是同一條線（或不在可滑動方向）→ 不動
            return;
        }

        // 最後仍用原本的碰撞/邊界檢查（保險）
        if (isValidMove(piece, newX, newY)) {
            piece.dataset.x = newX;
            piece.dataset.y = newY;
            piece.style.left = `${newX * unitSize}px`;
            piece.style.top = `${newY * unitSize}px`;

            // ✅ 不管滑幾格，都算「一步」
            moveCount++;
            moveCountSpan.textContent = moveCount;

            selectedPiece.classList.remove('selected');
            selectedPiece = null;

            checkWin();
        }
    }

    function isValidMove(movingPiece, newX, newY) {
        const w = parseInt(movingPiece.dataset.w);
        const h = parseInt(movingPiece.dataset.h);

        // 檢查是否超出邊界
        if (newX < 0 || newY < 0 || newX + w > 4 || newY + h > 5) {
            return false;
        }

        // 檢查是否與其他棋子碰撞
        for (const piece of pieces) {
            if (piece === movingPiece) continue;

            const otherX = parseInt(piece.dataset.x);
            const otherY = parseInt(piece.dataset.y);
            const otherW = parseInt(piece.dataset.w);
            const otherH = parseInt(piece.dataset.h);

            if (newX < otherX + otherW &&
                newX + w > otherX &&
                newY < otherY + otherH &&
                newY + h > otherY) {
                return false;
            }
        }
        return true;
    }
    
    function checkWin() {
        const caoCao = document.getElementById('cao-cao');
        if (parseInt(caoCao.dataset.x) === 1 && parseInt(caoCao.dataset.y) === 3) {
            winMessage.style.display = 'block';
        }
    }

    function resetGame() {
        moveCount = 0;
        moveCountSpan.textContent = moveCount;
        selectedPiece = null;
        winMessage.style.display = 'none';
        createPieces();
    }

    resetButton.addEventListener('click', resetGame);

    // 初始化遊戲
    resetGame();
</script>

</body>
</html>
